name: 自动打包发布

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: 打包并发布 Release
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 提取版本号
        id: meta
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: 更新 version.json
        run: |
          python3 - "${{ steps.meta.outputs.version }}" "${{ steps.meta.outputs.tag }}" <<'EOF'
          import json, sys
          version, tag = sys.argv[1], sys.argv[2]
          with open('version.json', 'r', encoding='utf-8') as f:
              data = json.load(f)
          data['version'] = version
          data['notes'] = '自动发布 ' + tag
          # 用带 tag 的固定地址：/releases/latest/... 不随版本变化，容易被代理/CDN 缓存住旧包
          data['url'] = 'https://github.com/Momo8715/ClassFundManagementSystem/releases/download/' + tag + '/update.zip'
          data.pop('sha256', None)  # 包内不放 sha256（由远端 version.json 提供），避免包内旧值造成误导
          with open('version.json', 'w', encoding='utf-8') as f:
              json.dump(data, f, ensure_ascii=False)
          EOF
          cp version.json /tmp/version.json.new
          echo "--- 更新后的 version.json ---"
          cat version.json

      - name: 打包 update.zip
        run: |
          zip -r update.zip . \
            -x "uploads/*" "backup_*/*" ".reasonix/*" ".git/*" \
            -x "*.zip" ".github/*" ".env*" "deploy.sh" "deploy.bat" "*.md" \
            -x "_emoji_test.txt" "_up_probe.ps1" "db_config.json" "*.log"
          ls -lh update.zip
          # 计算升级包 sha256 并写入待同步的 version.json，供客户端做完整性校验
          SHA=$(sha256sum update.zip | awk '{print $1}')
          echo "update.zip sha256: $SHA"
          python3 - "$SHA" <<'EOF'
          import json, sys
          sha = sys.argv[1]
          p = '/tmp/version.json.new'
          with open(p, 'r', encoding='utf-8') as f:
              data = json.load(f)
          data['sha256'] = sha
          with open(p, 'w', encoding='utf-8') as f:
              json.dump(data, f, ensure_ascii=False)
          print('version.json 已写入 sha256:', sha)
          EOF

      - name: 生成更新说明
        id: notes
        run: |
          PREV=$(git tag --sort=-version:refname | sed -n '2p')
          {
            echo "### 更新内容"
            echo ""
            if [ -n "$PREV" ] && git rev-parse -q --verify "$PREV" >/dev/null 2>&1; then
              git log --oneline --no-decorate "$PREV..HEAD" | sed 's/^/- /'
            else
              echo "- 初始发布"
            fi
          } > /tmp/release_notes.md
          echo "--- Release 说明 ---"
          cat /tmp/release_notes.md

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          body_path: /tmp/release_notes.md
          files: update.zip
          draft: false
          prerelease: false

      - name: 同步 version.json 到 main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 先拉取最新 main，避免使用 checkout 时的旧引用（防止 tag 与 main 推送时序竞争）
          git fetch origin main
          git checkout -B main origin/main
          cp /tmp/version.json.new version.json
          git add version.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: 更新 version.json 至 ${{ steps.meta.outputs.version }}"
            git rebase origin/main
            git push origin main
          else
            echo "version.json 无需变更"
          fi
