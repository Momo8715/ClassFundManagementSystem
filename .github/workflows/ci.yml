name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  php:
    name: PHP 语法检查 + 纯函数冒烟
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, zip, gd, intl
          coverage: none

      - name: PHP lint
        run: |
          set -e
          find . -type f -name '*.php' -not -path './.git/*' -print0 \
            | xargs -0 -n1 php -l

      - name: Smoke tests
        run: php tools/smoke.php
